buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // ProGuard: renames/shrinks/strips the jar so the shipped plugin can't be
        // decompiled back into editable source.
        classpath 'com.guardsquare:proguard-gradle:7.6.1'
    }
}

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'net.byebye'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "bstats"
        url = "https://repo.codemc.io/repository/maven-public/"
    }
}

dependencies {
    // Spigot API 1.21.4 on purpose: anything newer could leak API that 1.21.0 servers lack.
    // Paper-only calls are made by
    // reflection in PaperCompat, with a fallback.
    compileOnly("org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT")
    implementation("org.bstats:bstats-bukkit:3.1.0")
}

shadowJar {
    // Relocate bStats so it doesn't clash with other plugins that also shade it.
    relocate 'org.bstats', 'net.byebye.pregenBar.libs.bstats'
    // The shadow jar IS the dev artifact that goes into ProGuard.
    archiveClassifier = 'dev'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// ---------------------------------------------------------------------------
// Obfuscation
//
// The plain `jar` is an intermediate artifact; the shadow (fat) jar carries the
// 'dev' classifier and feeds ProGuard, which writes the shippable
// PregenBar-<version>.jar. `build` and `assemble` produce it automatically.
// ---------------------------------------------------------------------------
tasks.named('jar', Jar) {
    archiveClassifier = 'plain'
}

tasks.register('proguard', proguard.gradle.ProGuardTask) {
    dependsOn 'shadowJar'
    group = 'build'
    description = 'Obfuscates the plugin jar with ProGuard.'

    // ProGuard's libraryjars use jmod filter syntax Gradle's input tracker cannot stat.
    doNotTrackState('ProGuard library paths use filter syntax Gradle cannot stat')

    def libsDir = layout.buildDirectory.dir('libs').get().asFile
    def inJar  = new File(libsDir, "${project.name}-${project.version}-dev.jar")
    def outJar = new File(libsDir, "${project.name}-${project.version}.jar")

    injars inJar
    outjars outJar
    configuration file('proguard-rules.pro')

    file("${System.getProperty('java.home')}/jmods").listFiles().findAll { it.name.endsWith('.jmod') }.each {
        libraryjars it, jarfilter: '!**.jar', filter: '!module-info.class'
    }
    libraryjars configurations.compileClasspath

    // Author-side de-obfuscation map for reading stack traces from obfuscated builds.
    printmapping layout.buildDirectory.file('proguard/mapping.txt').get().asFile

    doFirst { outJar.delete() }
}

tasks.named('assemble') { dependsOn 'proguard' }
